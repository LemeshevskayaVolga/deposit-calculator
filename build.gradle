plugins {
    id 'java'
    id 'application'
}

group = 'by.student'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation('org.junit.jupiter:junit-jupiter:5.14.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

application {
    mainClass = 'by.student.deposit.Main'
}
test {
    useJUnitPlatform()

    // Чтобы русский текст нормально печатался в консоли
    systemProperty 'file.encoding', 'UTF-8'

    testLogging {
        events 'passed', 'skipped', 'failed'
    }

    reports {
        html.required = true
        junitXml.required = true
    }
}
test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
    }

    reports {
        html.required = true
        junitXml.required = true
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': 'by.student.deposit.Main'
        )
    }
}
